<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

<body>
    <header class="en-tete">
        <div class="conteneur en-tete-contenu">
            <a href="/index.html" class="logoName"><img src="/img/logo.png" class="logo" alt="Logo">ARNOLD</a>

            <nav aria-label="Navigation principale">

            </nav>
        </div>
    </header>


    <main class="mainContact">
        <h1 class="titleForm">Veuillez écrire vos informations</h1>
        <form class="form">
            <div class="label">
                <label for="email">Voter E-mail</label>
                <label for="number">Votre Numéro de Téléphone</label>
                <label for="text">Raison de Nous Appeler</label>
            </div>
            <div class="input">
                <input type="email" placeholder="Enter Voter E-mail">
                <input type="number" placeholder="Enter Voter Numéro de Téléphone">
                <textarea id="story" name="story" rows="5" cols="33" class="comment"></textarea>
            </div>
            
        </form>
    </main>


    <footer class="pied-de-page">
        <div class="conteneur">

        <div class="pied-haut">
            <div>
            <p class="logo logo-clair">Élan Fitness</p>
            <p class="slogan">Ton énergie, ton rythme.</p>
            </div>

            <nav aria-label="Navigation du pied de page">
            <ul class="menu menu-pied">
                <li><a href="#accueil">Accueil</a></li>
                <li><a href="#a-propos">À propos</a></li>
                <li><a href="#programmes">Programmes</a></li>
            </ul>
            </nav>
        </div>

        <div class="pied-bas">
            <p>Adresse : 12 rue des Palmiers, 20000 Casablanca</p>
            <p>&copy; 2026 Élan Fitness — Projet pédagogique fictif</p>
